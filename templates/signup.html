{% extends "base.html" %}
{% block title %}Register School{% endblock %}
{% block public %}
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-head">
      <span class="monogram">LM</span>
      <div>
        <h1>Register a school</h1>
        <p class="muted">Create a dedicated locker registry for your campus.</p>
      </div>
    </div>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <label>School name
        <input name="name" required autofocus placeholder="e.g. Oakridge High School">
      </label>
      <label>School code <span class="muted">(used when signing in)</span>
        <input name="school" required pattern="[a-z0-9][a-z0-9\-]{2,30}" placeholder="oakridge-high" autocapitalize="off">
      </label>
      <label>Administrator username
        <input name="username" required>
      </label>
      <label>Password <span class="muted">(8+ characters)</span>
        <input name="password" type="password" minlength="8" required>
      </label>
      <button class="btn" style="width:100%;margin-top:4px;padding:10px">Create school workspace →</button>
    </form>
    <div class="auth-foot">
      Already registered? <a href="{{ url_for('login') }}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
